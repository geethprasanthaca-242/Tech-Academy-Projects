<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
	<link rel="stylesheet" type="text/css" href="CSS_Lists.css">
</head>

<body>

    <h2>Unordered List</h2>
    <ul>
        <li>Cats</li>
        <li>Dogs</li>
        <li>Birds</li>
        <li>Fish</li>
    </ul>

    <h2>Ordered List</h2>
    <ol>
        <li>Bread</li>
        <li>Milk</li>
        <li>Eggs</li>
        <li>Cheese</li>
    </ol>

</body>
</html>
